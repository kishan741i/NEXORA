    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050505;
            --surface: #0f111a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(112, 0, 255, 0.05) 0%, transparent 40%);
        }

        /* --- DASHBOARD HEADER --- */
        .top-bar {
            padding: 40px 5%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(to bottom, #0a0a0a, transparent);
        }

        .brand-zone h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #fff;
        }

        .brand-zone h1 span {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .brand-zone p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        #courseSearch {
            width: 100%;
            padding: 14px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        #courseSearch:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.1);
        }

        /* --- NAVIGATION --- */
        .filter-nav {
            padding: 30px 5% 10px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-nav::-webkit-scrollbar { display: none; }

        .chip {
            padding: 10px 22px;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: 0.3s;
        }

        .chip.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* --- SYSTEM STATUS INDICATOR --- */
        .stats-info {
            padding: 15px 5%;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- GRID --- */
        .main-grid {
            flex: 1;
            padding: 0 5% 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .digital-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            transition: 0.3s ease;
            position: relative;
        }

        .digital-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: #111420;
        }

        .card-cat {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .digital-card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .digital-card p {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .card-footer {
            padding-top: 15px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- FLOATING SCROLL BUTTON --- */
        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(0, 242, 255, 0.3);
            z-index: 1000;
            transition: 0.3s;
        }

        #scrollTopBtn:hover {
            transform: scale(1.1);
            background: #fff;
        }

        /* --- FOOTER --- */
        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid var(--border);
            background: #080808;
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 20px; }
            .brand-zone h1 { font-size: 2rem; }
            .search-wrapper { max-width: 100%; }
        }
    </style>
</head>

        let selectedCat = 'all';
        const searchInput = document.getElementById('courseSearch');
        const container = document.getElementById('courseContainer');
        const statusCount = document.getElementById('statusCount');
        const scrollBtn = document.getElementById('scrollTopBtn');

        function render(data) {
            container.innerHTML = data.map(c => `
                <div class="digital-card">
                    <div class="card-cat">${c.cat}</div>
                    <h3>${c.title}</h3>
                    <p>${c.desc}</p>
                    <div class="card-footer">
                        <i class="far fa-clock"></i> ${c.dur}
                    </div>
                </div>
            `).join('');
            
            // System Status Logic
            statusCount.innerText = `[ SYSTEM STATUS: ${data.length} PATHS FOUND ]`;
        }

        function filter() {
            const query = searchInput.value.toLowerCase().replace(/[.]/g, "");
            const filtered = courses.filter(c => {
                const titleMatch = c.title.toLowerCase().replace(/[.]/g, "").includes(query);
                const descMatch = c.desc.toLowerCase().includes(query);
                const catMatch = selectedCat === 'all' || c.cat === selectedCat;
                return catMatch && (titleMatch || descMatch);
            });
            render(filtered);
        }

        searchInput.addEventListener('input', filter);

        document.querySelectorAll('.chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCat = btn.getAttribute('data-cat');
                filter();
            });
        });

        // Scroll Logic
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollBtn.style.display = "flex";
            } else {
                scrollBtn.style.display = "none";
            }
        };

        render(courses);
    </script>
